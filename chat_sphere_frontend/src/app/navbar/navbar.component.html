<nav class="tb-navbar" role="navigation">
  <div class="navbar-container">
    <div class="left-section">
      <span class="logo">
        <!-- Optional chat icon SVG, visually matches app name -->
        <svg class="chat-logo" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="16" fill="#4F8CFF"/>
          <rect x="8" y="10" width="16" height="10" rx="5" fill="white"/>
          <ellipse cx="12.25" cy="15" rx="1.25" ry="1.25" fill="#4F8CFF"/>
          <ellipse cx="16" cy="15" rx="1.25" ry="1.25" fill="#4F8CFF"/>
          <ellipse cx="19.75" cy="15" rx="1.25" ry="1.25" fill="#4F8CFF"/>
        </svg>
        <span class="app-name">TalkBuddy</span>
      </span>
    </div>
    <ul class="center-section nav-links">
      <li *ngFor="let link of navLinks">
        <a [href]="link.path" tabindex="0">{{ link.label }}</a>
      </li>
    </ul>
    <div class="right-section">
      <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-pressed]="isDarkTheme" aria-label="Toggle dark/light mode">
        <span *ngIf="!isDarkTheme" class="toggle-icon sun" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#FFD166"/><g stroke="#FFD166" stroke-width="2"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/></g></svg>
        </span>
        <span *ngIf="isDarkTheme" class="toggle-icon moon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#FFD166" d="M21 15.5A9 9 0 0 1 8.5 3a1 1 0 0 0-1.18-1.16A10 10 0 1 0 22.16 16.68 1 1 0 0 0 21 15.5z"/></svg>
        </span>
        <!-- Sliding switch background (decorative) -->
        <span class="slider" [class.slider-dark]="isDarkTheme" [class.slider-light]="!isDarkTheme"></span>
      </button>
    </div>
  </div>
</nav>
